<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YAHDD STORE | Premium Game Topup</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root {
            --bg-color: #0a0a0a;
            --card-bg: rgba(20, 20, 25, 0.7);
            --primary: #00f3ff;
            --secondary: #b000ff;
            --border-color: rgba(0, 243, 255, 0.2);
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --input-bg: #000;
            --success: #10b981;
        }

        /* TEMA CERAH */
        body.light-mode {
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --primary: #007bff;
            --secondary: #6610f2;
            --border-color: rgba(0, 123, 255, 0.2);
            --text-main: #111111;
            --text-muted: #555555;
            --input-bg: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Rajdhani', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow-x: hidden;
            transition: background 0.3s, color 0.3s;
            background-image: radial-gradient(circle at 50% 0%, rgba(0, 243, 255, 0.1) 0%, transparent 50%), radial-gradient(circle at 100% 100%, rgba(176, 0, 255, 0.05) 0%, transparent 50%);
            background-attachment: fixed;
        }

        /* --- NAVIGASI --- */
        nav {
            position: fixed; top: 0; width: 100%; padding: 15px 20px;
            display: flex; justify-content: space-between; align-items: center;
            background: var(--bg-color); opacity: 0.95; backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color); z-index: 1000;
            transition: background 0.3s;
        }

        .logo { font-family: 'Oswald', sans-serif; font-size: 22px; font-weight: 700; letter-spacing: 2px; color: var(--primary); text-transform: uppercase; }
        
        .nav-right { display: flex; align-items: center; gap: 15px; }
        
        .status-dot { width: 10px; height: 10px; background: var(--success); border-radius: 50%; box-shadow: 0 0 10px var(--success); animation: pulse 2s infinite; display: inline-block; margin-right: 5px; }
        .status-text { font-size: 12px; font-weight: 600; color: var(--text-muted); }
        
        .coin-display { display: flex; align-items: center; background: var(--card-bg); padding: 5px 10px; border-radius: 20px; border: 1px solid var(--border-color); font-weight: 700; font-size: 14px; color: #f59e0b; }
        
        .btn-icon { background: transparent; border: none; font-size: 20px; cursor: pointer; color: var(--text-main); transition: 0.3s; }
        .btn-icon:hover { transform: scale(1.1); color: var(--primary); }

        /* --- HERO --- */
        .hero { margin-top: 80px; padding: 40px 20px; text-align: center; }
        .hero h1 { font-family: 'Oswald', sans-serif; font-size: 36px; font-weight: 700; text-transform: uppercase; margin-bottom: 10px; }
        .hero h1 span { color: var(--primary); }
        
        /* CARIAN GAME */
        .search-box { max-width: 500px; margin: 20px auto 0 auto; position: relative; }
        .search-box input { width: 100%; padding: 15px 20px; border-radius: 30px; border: 1px solid var(--border-color); background: var(--card-bg); color: var(--text-main); font-family: 'Rajdhani'; font-size: 16px; outline: none; }
        .search-box input:focus { border-color: var(--primary); box-shadow: 0 0 15px rgba(0, 243, 255, 0.2); }

        /* --- KAD GAME --- */
        .games-container { padding: 20px 20px 80px 20px; max-width: 1200px; margin: auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 25px; }

        .game-card {
            background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 15px;
            overflow: hidden; cursor: pointer; transition: 0.3s; display: flex; flex-direction: column;
        }

        .game-card:hover { transform: translateY(-5px); border-color: var(--primary); box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2); }
        
        .game-bg { height: 180px; width: 100%; background-size: cover; background-position: center; position: relative; }
        .game-bg::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to bottom, transparent 30%, var(--bg-color) 100%); }

        .game-content { padding: 20px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; z-index: 2; margin-top: -30px; }
        .game-title { font-family: 'Oswald', sans-serif; font-size: 20px; font-weight: 700; margin-bottom: 5px; text-transform: uppercase; }
        .game-price { font-size: 14px; color: var(--primary); font-weight: 700; margin-bottom: 15px; }
        
        .btn-play { background: rgba(0, 0, 0, 0.1); color: var(--text-main); border: 1px solid var(--border-color); padding: 10px; border-radius: 5px; width: 100%; text-align: center; font-weight: 700; transition: 0.3s; text-transform: uppercase; font-size: 12px;}
        .game-card:hover .btn-play { background: var(--primary); color: #000; border-color: var(--primary); }

        /* --- MODAL TOPUP --- */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(5px); display: none; justify-content: center; align-items: center; z-index: 2000; padding: 20px; opacity: 0; transition: opacity 0.3s ease; }
        .modal-overlay.show { display: flex; opacity: 1; }
        .modal-content { background: var(--bg-color); border: 1px solid var(--primary); border-radius: 15px; padding: 25px; width: 100%; max-width: 500px; box-shadow: 0 0 30px rgba(0, 243, 255, 0.1); max-height: 90vh; overflow-y: auto; position: relative; }
        
        .close-btn { position: absolute; top: 15px; right: 15px; background: transparent; border: none; color: var(--text-main); font-size: 24px; cursor: pointer; }
        .modal-header h2 { font-family: 'Oswald', sans-serif; font-size: 22px; color: var(--primary); margin-bottom: 15px; text-transform: uppercase; border-bottom: 1px solid var(--border-color); padding-bottom: 10px;}

        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; font-size: 14px; color: var(--text-muted); margin-bottom: 8px; font-weight: 600; text-transform: uppercase; }
        .input-group input { width: 100%; padding: 12px; background: var(--input-bg); border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-main); font-family: 'Rajdhani'; outline: none; font-size: 16px; }
        .input-group input:focus { border-color: var(--primary); }

        .item-list { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; max-height: 300px; overflow-y: auto; }
        .item-btn { background: var(--input-bg); border: 1px solid var(--border-color); color: var(--text-main); padding: 12px; border-radius: 8px; cursor: pointer; text-align: center; transition: 0.2s; display: flex; flex-direction: column; }
        .item-btn:hover { border-color: var(--primary); }
        .item-btn.active { border-color: var(--primary); background: rgba(0, 243, 255, 0.1); box-shadow: 0 0 15px rgba(0, 243, 255, 0.1); }
        
        .pkg-name { font-weight: 700; font-size: 15px; margin-bottom: 4px; }
        .pkg-price { color: var(--text-muted); font-size: 12px; }
        .item-btn.active .pkg-price { color: var(--primary); }

        /* KALKULATOR NILAI */
        #valueCalculator { display: none; font-size: 12px; color: var(--success); text-align: center; margin-bottom: 15px; font-weight: 600; }

        .btn-buy { width: 100%; background: var(--primary); color: #000; font-family: 'Oswald', sans-serif; font-weight: 700; padding: 15px; border-radius: 8px; border: none; cursor: pointer; font-size: 16px; text-transform: uppercase; transition: 0.3s; }
        .btn-buy:disabled { background: #333; color: #666; cursor: not-allowed; }

        /* --- LOADING & RECEIPT --- */
        .loading-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-color); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 3000; }
        .spinner { width: 50px; height: 50px; border: 4px solid var(--border-color); border-top: 4px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px; }
        .loading-text { color: var(--primary); font-family: 'Oswald'; font-size: 18px; letter-spacing: 2px; }

        .receipt-content { background: var(--card-bg); color: var(--text-main); border-radius: 15px; padding: 25px; width: 100%; max-width: 380px; text-align: center; border: 1px solid var(--border-color); }
        .receipt-icon { font-size: 50px; color: var(--success); margin-bottom: 10px; }
        .receipt-title { font-family: 'Oswald'; font-size: 24px; font-weight: 700; margin-bottom: 5px; text-transform: uppercase;}
        .receipt-sub { font-size: 14px; color: var(--text-muted); margin-bottom: 20px; }
        .receipt-box { background: var(--input-bg); border-radius: 10px; padding: 15px; text-align: left; margin-bottom: 20px; border-left: 4px solid var(--primary); }
        .receipt-box p { font-size: 13px; margin-bottom: 8px; display: flex; justify-content: space-between; }
        
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    </style>
</head>
<body>

    <nav>
        <div class="logo">YAHDD<span>STORE</span></div>
        <div class="nav-right">
            <div class="coin-display">🪙 <span id="coinBalance">0</span></div>
            <button class="btn-icon" id="themeToggle" onclick="tukarTema()">🌙</button>
        </div>
    </nav>

    <section class="hero">
        <div style="font-size: 12px; font-weight: bold; margin-bottom: 10px;">
            <span class="status-dot"></span><span class="status-text">SERVER ONLINE</span>
        </div>
        <h1>Topup Game <span>Level Dewa</span></h1>
        <p style="font-size: 16px; color: var(--text-muted); margin-bottom: 20px;">Pengalaman topup terpantas di Malaysia.</p>
        
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="🔍 Cari game (contoh: MLBB, PUBG)..." onkeyup="cariGame()">
        </div>
    </section>

    <section class="games-container" id="gameGrid"></section>

    <div class="modal-overlay" id="topupModal">
        <div class="modal-content">
            <button class="close-btn" onclick="tutupModal()">×</button>
            <div class="modal-header">
                <h2 id="modalTitle">Topup</h2>
            </div>
            
            <div class="input-group">
                <label>Masukkan ID Pemain:</label>
                <input type="text" id="playerId" placeholder="ID & Zone ID">
            </div>

            <div class="input-group">
                <label>Pilih Pakej:</label>
                <div class="item-list" id="itemList"></div>
            </div>

            <div id="valueCalculator">Nilai: <span id="calcText"></span></div>
            <button class="btn-buy" id="btnBeli" onclick="prosesBeli()" disabled>Pilih Pakej</button>
        </div>
    </div>

    <div class="loading-screen" id="loadingScreen">
        <div class="spinner"></div>
        <div class="loading-text">MEMPROSES...</div>
    </div>

    <div class="modal-overlay" id="receiptModal" style="align-items: center;">
        <div class="receipt-content">
            <div class="receipt-icon">✅</div>
            <div class="receipt-title">Topup Berjaya!</div>
            <div class="receipt-sub">Pesanan diproses</div>
            
            <div class="receipt-box">
                <p><strong>Game:</strong> <span id="resGame"></span></p>
                <p><strong>Pakej:</strong> <span id="resPakej"></span></p>
                <p><strong>Jumlah:</strong> <span id="resHarga"></span></p>
                <p><strong>Ref No:</strong> <span id="resRef" style="color:var(--primary); font-weight:bold;"></span></p>
                <p style="margin-top: 10px; border-top: 1px dashed #ccc; padding-top: 10px;">
                    <strong>Transfer Ke:</strong><br>
                    <span style="font-size: 13px;">Maybank: 1234-5678-9012</span>
                </p>
            </div>
            <button class="btn-buy" onclick="tutupReceipt()" style="margin-bottom:10px;">Selesai</button>
            <button class="btn-buy" onclick="window.location.href='track.html'" style="background:#333; color:var(--primary);">🔍 Track</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://spxidzfqjgpifvutqjlx.supabase.co";
        const SUPABASE_KEY = "sb_publishable_plobSMHs6jmvbWomZdh06w_JwTxVfql";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // --- SISTEM MATA WANG & TEMA ---
        let coins = parseInt(localStorage.getItem('yahddCoins')) || 0;
        document.getElementById('coinBalance').innerText = coins;
        
        function tambahCoin(amount) {
            coins += amount;
            localStorage.setItem('yahddCoins', coins);
            document.getElementById('coinBalance').innerText = coins;
        }

        function tukarTema() {
            document.body.classList.toggle('light-mode');
            let isLight = document.body.classList.contains('light-mode');
            document.getElementById('themeToggle').innerText = isLight ? '☀️' : '🌙';
        }

        // --- CARIAN GAME ---
        function cariGame() {
            let input = document.getElementById('searchInput').value.toLowerCase();
            let cards = document.querySelectorAll('.game-card');
            cards.forEach(card => {
                let title = card.querySelector('.game-title').innerText.toLowerCase();
                if (title.includes(input)) {
                    card.style.display = 'flex';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        // --- DATA GAME ---
        const games = [
            { id: 'mlbb', name: 'Mobile Legends', bg: 'https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=800&auto=format&fit=crop', minPrice: 'RM 5.00' },
            { id: 'pubg', name: 'PUBG Mobile (UC)', bg: 'https://images.unsplash.com/photo-1538481199705-c710c4e965fc?q=80&w=800&auto=format&fit=crop', minPrice: 'RM 4.50' },
            { id: 'robux', name: 'Roblox (Robux)', bg: 'https://images.unsplash.com/photo-1600861194942-f883de0dfe96?q=80&w=800&auto=format&fit=crop', minPrice: 'RM 5.00' },
            { id: 'ff', name: 'Free Fire', bg: 'https://images.unsplash.com/photo-1593305841991-05c297ba4575?q=80&w=800&auto=format&fit=crop', minPrice: 'RM 3.00' },
            { id: 'genshin', name: 'Genshin Impact', bg: 'https://images.unsplash.com/photo-1614294148960-9aa740632a87?q=80&w=800&auto=format&fit=crop', minPrice: 'RM 20.00' }
        ];

        const packages = {
            'mlbb': [{ name: '86 Diamond', price: 500 }, { name: '172 Diamond', price: 1000 }, { name: '257 Diamond', price: 1500 }, { name: '706 Diamond', price: 4000 }],
            'pubg': [{ name: '60 UC', price: 450 }, { name: '325 UC', price: 2200 }, { name: '660 UC', price: 4400 }],
            'robux': [{ name: '80 Robux', price: 500 }, { name: '400 Robux', price: 2400 }],
            'ff': [{ name: '70 Diamond', price: 300 }, { name: '140 Diamond', price: 600 }],
            'genshin': [{ name: '60 Genesis', price: 2000 }, { name: '300 Genesis', price: 10000 }]
        };

        let selectedGame = null;
        let selectedPackage = null;

        const gameGrid = document.getElementById('gameGrid');
        games.forEach(game => {
            let card = document.createElement('div');
            card.className = 'game-card';
            card.onclick = () => bukaModal(game.name, game.id);
            card.innerHTML = `
                <div class="game-bg" style="background-image: url('${game.bg}')"></div>
                <div class="game-content">
                    <div>
                        <div class="game-title">${game.name}</div>
                        <div class="game-price">Mula ${game.minPrice}</div>
                    </div>
                    <div class="btn-play">Topup</div>
                </div>
            `;
            gameGrid.appendChild(card);
        });

        function bukaModal(namaGame, gameId) {
            selectedGame = namaGame;
            selectedPackage = null;
            document.getElementById('modalTitle').innerText = "Topup " + namaGame;
            document.getElementById('playerId').value = "";
            document.getElementById('btnBeli').disabled = true;
            document.getElementById('btnBeli').innerText = "Pilih Pakej";
            document.getElementById('valueCalculator').style.display = 'none';
            
            const itemList = document.getElementById('itemList');
            itemList.innerHTML = "";
            
            let pkgs = packages[gameId] || packages['mlbb'];
            
            pkgs.forEach(pkg => {
                let btn = document.createElement('div');
                btn.className = 'item-btn';
                btn.innerHTML = `<div class="pkg-name">${pkg.name}</div><div class="pkg-price">RM ${(pkg.price / 100).toFixed(2)}</div>`;
                btn.onclick = () => {
                    document.querySelectorAll('.item-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    selectedPackage = pkg;
                    let btnBeli = document.getElementById('btnBeli');
                    btnBeli.disabled = false;
                    btnBeli.innerText = `Beli - RM ${(pkg.price / 100).toFixed(2)}`;
                    
                    // Kira Nilai (Value Calculator)
                    let qty = parseInt(pkg.name);
                    if(!isNaN(qty)) {
                        let val = (qty / (pkg.price / 100)).toFixed(1);
                        document.getElementById('calcText').innerText = `${val} unit / RM`;
                        document.getElementById('valueCalculator').style.display = 'block';
                    } else {
                        document.getElementById('valueCalculator').style.display = 'none';
                    }
                };
                itemList.appendChild(btn);
            });
            
            document.getElementById('topupModal').classList.add('show');
        }

        function tutupModal() { document.getElementById('topupModal').classList.remove('show'); }

        async function prosesBeli() {
            let playerId = document.getElementById('playerId').value;
            if (!playerId) return alert("Masukkan ID Pemain!");
            if (!selectedPackage) return alert("Pilih pakej!");

            tutupModal();
            document.getElementById('loadingScreen').style.display = 'flex';

            let refNo = "YH-" + Math.floor(Math.random() * 1000000);

            const { error } = await supabaseClient.from('orders').insert([{
                ref_no: refNo, game: selectedGame, player_id: playerId,
                pakej: selectedPackage.name, harga: selectedPackage.price, status: 'pending'
            }]);

            document.getElementById('loadingScreen').style.display = 'none';

            if (error) {
                alert("Gagal. Sila cuba lagi.");
            } else {
                // Tambah Coin (1 Coin setiap RM1)
                let co
