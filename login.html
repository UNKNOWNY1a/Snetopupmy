<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YAHDD STORE | Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { 
            --bg: #050000; --primary: #ff0033; --card: rgba(20, 0, 0, 0.85); 
            --border: rgba(255, 0, 51, 0.3); --text: #fff; --muted: #a0a0a0; --input: #0a0000; 
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Rajdhani', sans-serif; }
        body { 
            background: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; 
            min-height: 100vh; background-image: radial-gradient(circle at 50% 0%, rgba(255,0,51,0.15) 0%, transparent 60%); 
        }
        .login-box { 
            background: var(--card); border: 1px solid var(--primary); border-radius: 10px; 
            padding: 30px; width: 90%; max-width: 400px; box-shadow: 0 0 30px rgba(255, 0, 51, 0.2); 
        }
        h2 { font-family: 'Orbitron'; color: var(--primary); text-align: center; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 2px; }
        .input-group { margin-bottom: 15px; }
        label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; text-transform: uppercase; }
        input { 
            width: 100%; padding: 12px; background: var(--input); border: 1px solid #333; 
            border-radius: 5px; color: var(--primary); font-family: 'Orbitron'; outline: none; font-size: 14px; 
        }
        input:focus { border-color: var(--primary); box-shadow: 0 0 10px rgba(255,0,51,0.2); }
        .btn { 
            width: 100%; background: var(--primary); color: #000; font-family: 'Orbitron'; 
            font-weight: 900; padding: 15px; border-radius: 5px; border: none; cursor: pointer; 
            font-size: 14px; text-transform: uppercase; margin-top: 10px; transition: 0.2s; 
        }
        .btn:active { transform: scale(0.98); }
        .msg { text-align: center; font-size: 13px; margin-top: 15px; display: none; }
        .msg.error { color: #ef4444; display: block; }
        .msg.success { color: #10b981; display: block; }
        .switch { text-align: center; font-size: 12px; color: var(--muted); margin-top: 20px; }
        .switch a { color: var(--primary); cursor: pointer; text-decoration: underline; }
    </style>
</head>
<body>

    <div class="login-box">
        <h2 id="formTitle">Log Masuk</h2>
        
        <div class="input-group">
            <label>Emel:</label>
            <input type="email" id="email" placeholder="emel@contoh.com">
        </div>
        <div class="input-group">
            <label>Kata Laluan:</label>
            <input type="password" id="password" placeholder="********">
        </div>

        <button class="btn" id="mainBtn" onclick="handleAuth()">Log Masuk</button>
        <div class="msg" id="msgBox"></div>

        <div class="switch">
            <span id="switchText">Belum ada akaun?</span> 
            <a onclick="toggleMode()" id="switchBtn">Daftar Sekarang</a>
        </div>
    </div>

    <script>
        // ⚠️ TUKAR SINI DENGAN KUNCI SUPABASE ANDA ⚠️
        const SUPABASE_URL = "https://spxidzfqjgpifvutqjlx.supabase.co";
        const SUPABASE_KEY = "sb_publishable_plobSMHs6jmvbWomZdh06w_JwTxVfql";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let isLoginMode = true;

        function toggleMode() {
            isLoginMode = !isLoginMode;
            document.getElementById('formTitle').innerText = isLoginMode ? "Log Masuk" : "Daftar Akaun";
            document.getElementById('mainBtn').innerText = isLoginMode ? "Log Masuk" : "Daftar";
            document.getElementById('switchText').innerText = isLoginMode ? "Belum ada akaun?" : "Dah ada akaun?";
            document.getElementById('switchBtn').innerText = isLoginMode ? "Daftar Sekarang" : "Log Masuk";
            document.getElementById('msgBox').className = 'msg';
        }

        async function handleAuth() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const msgBox = document.getElementById('msgBox');
            const btn = document.getElementById('mainBtn');

            if(!email || !password) {
                msgBox.innerText = "Sila isi emel dan kata laluan.";
                msgBox.className = "msg error";
                return;
            }

            btn.innerText = "Memproses...";
            btn.disabled = true;

            if(isLoginMode) {
                // LOG MASUK
                const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
                if(error) {
                    msgBox.innerText = error.message;
                    msgBox.className = "msg error";
                    btn.innerText = "Log Masuk"; btn.disabled = false;
                } else {
                    msgBox.innerText = "Berjaya! Mengalih ke kedai...";
                    msgBox.className = "msg success";
                    setTimeout(() => window.location.href = 'store.html', 1000);
                }
            } else {
                // DAFTAR
                const { error } = await supabaseClient.auth.signUp({ email, password });
                if(error) {
                    msgBox.innerText = error.message;
                    msgBox.className = "msg error";
                    btn.innerText = "Daftar"; btn.disabled = false;
                } else {
                    msgBox.innerText = "Berjaya daftar! Sila log masuk.";
                    msgBox.className = "msg success";
                    toggleMode(); 
                    btn.innerText = "Log Masuk"; btn.disabled = false;
                }
            }
        }
    </script>
</body>
</html>
